AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "db/schema.rb"
    - "db/queue_schema.rb"
    - "db/cache_schema.rb"
    - "db/migrate/**/*"
    - "db/seeds.rb"
    - "config/initializers/rswag-api.rb"
    - "config/initializers/rswag-ui.rb"
    - "config/initializers/devise.rb"
    - spec/**/*.rb

Style/Documentation:
  Enabled: false

Layout/EndOfLine:
  Enabled: false
